plugins {
    id 'com.android.library'
}

android {
    namespace 'ir.raznameh.plugin'
    compileSdk 36

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':godotlib')
    // Tapsell Mediation (rewarded video) — compileOnly: the APP gradle
    // template (android/build/app/build.gradle) carries the real maven
    // dependency so transitive libs resolve there and stay out of the AAR.
    compileOnly 'ir.tapsell:tapsell:1.3.0'
}
